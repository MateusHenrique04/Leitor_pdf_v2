# ATENÇÃO: versões escolhidas de memória, sem poder consultar o Maven.
# As da seção 2 do prompt de continuidade já compilaram no seu PC.
# As NOVAS (marcadas) precisam ser conferidas: ksp, room, lifecycle, junit, androidxTest*.
[versions]
agp = "8.5.2"
kotlin = "2.0.20"
composeBom = "2024.09.00"
activityCompose = "1.9.2"
coreKtx = "1.13.1"
coroutines = "1.8.1"
# --- novas na Fase 1 (conferir) ---
ksp = "2.0.20-1.0.25"          # precisa começar com a versão do Kotlin (2.0.20)
room = "2.6.1"
lifecycle = "2.8.6"
junit = "4.13.2"
androidxTestExt = "1.2.1"
androidxTestRunner = "1.6.2"
# --- nova na Fase 3b (a mesma versão que já compilou no lector-probe) ---
pdfbox = "2.0.27.0"
# --- nova na Fase 4 (CONFERIR no Maven/Android Studio) ---
okhttp = "4.12.0"
# --- nova na Fase 6b (CONFERIR no Maven/Android Studio; 1.4.x compila com compileSdk 34) ---
media3 = "1.4.1"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons-core = { module = "androidx.compose.material:material-icons-core" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
pdfbox-android = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfbox" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidx-media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
androidx-media3-session = { module = "androidx.media3:media3-session", version.ref = "media3" }
junit = { module = "junit:junit", version.ref = "junit" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExt" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
